name: Build MobileGL

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main

    - name: Configure CMake and Build
      run: |
          bash build.bash

    - name: Upload build output
      uses: actions/upload-artifact@main
      with:
        name: MG
        path: build/*.so
