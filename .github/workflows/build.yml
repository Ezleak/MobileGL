name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - Feat/Backend-Direct-GLES

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{github.workspace}}

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 32

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-30
            platforms;android-33
            build-tools;33.0.0
            cmake;3.22.1
            ndk;25.1.8937393

      - name: Update glslang external sources
        working-directory: ${{env.PROJECT_ROOT}}/3rdparty/glslang
        run: python update_glslang_sources.py

      - name: Configure CMake for Android
        working-directory: ${{env.PROJECT_ROOT}}
        run: |
          if [ "${{ secrets.ACTIONS_STEP_DEBUG }}" == "true" ]; then
            cmake -S . -B build-android \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_PLATFORM=android-30 \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_NDK=$ANDROID_NDK_HOME \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TEST=OFF \
              -DBUILD_BENCHMARK=OFF \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          else
            cmake -S . -B build-android \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_PLATFORM=android-30 \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_NDK=$ANDROID_NDK_HOME \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TEST=OFF \
              -DBUILD_BENCHMARK=OFF \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          fi

      - name: Build for Android
        working-directory: ${{env.PROJECT_ROOT}}/build-android
        run: cmake --build . --parallel 4

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-output
          path: ${{env.PROJECT_ROOT}}/build-android/**
          if-no-files-found: warn
