name: Build MobileGL

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '是否发布到Releases'
        required: true
        type: choice
        default: 'No'
        options:
          - 'Yes'
          - 'No'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: 配置 CMake 和 Build
      run: bash MobileGL_build.bash

    - name: 上传生成的.so文件
      uses: actions/upload-artifact@v4
      with:
        name: MG
        path: build/*.so

    - name: 克隆MobileGL-Plugin
      uses: actions/checkout@v4
      with:
        repository: KongXing0819/MobileGL-Plugin
        path: MobileGL-Plugin

    - name: 复制libMobileGL.so文件到MobileGL-Plugin
      run: |
        cp build/libMobileGL.so MobileGL-Plugin/app/src/main/jniLibs/arm64-v8a/

    - name: 设置Java环境
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: 设置Android构建工具
      uses: android-actions/setup-android@v2
      with:
        build-tools-version: "34.0.0"

    - name: 缓存Gradle依赖
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

    - name: 编译APK
      working-directory: MobileGL-Plugin
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 上传APK文件
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: MobileGL-Plugin/app/build/outputs/apk/debug/*.apk

    - name: 生成Releases名称
      if: ${{ github.event.inputs.build_type == 'Yes' }}
      id: get-date
      run: |
        echo "name=$(TZ=Asia/Shanghai date +'%y.%m.%d_%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: 创建Release
      if: ${{ github.event.inputs.build_type == 'Yes' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get-date.outputs.name }}
        name: ${{ steps.get-date.outputs.name }}
        files: |
          build/*.so
          MobileGL-Plugin/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
