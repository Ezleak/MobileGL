name: Build MobileGL

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '是否发布到Releases'
        required: true
        type: choice
        default: 'No'
        options:
          - 'Yes'
          - 'No'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: 配置 CMake 和 Build
      run: bash MobileGL_build.bash

    - name: 上传生成的.so文件
      uses: actions/upload-artifact@v4
      with:
        name: MG
        path: build/*.so
